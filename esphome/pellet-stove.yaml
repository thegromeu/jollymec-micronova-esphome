# Jolly-Mec GLOBE 10 kW pellet stove (Micronova board) -> Home Assistant
# Hardware: philibertc's "Micronova Controller" board (rev 1.5) + WeMos D1 Mini (ESP8266)
#   https://github.com/philibertc/micronova_controller
# Memory addresses were found by scanning THIS stove: they may differ on yours.
# Read docs/memory-map.md before reusing this file.

esphome:
  name: pellet-stove
  friendly_name: Pellet stove

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pellet-Stove Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------------------
# Micronova serial link: 1200 baud, 8N2
# D4 = TX, D3 = RX (with pull-up), D2 = receive-enable of the philibertc board
# ---------------------------------------------------------------------------
uart:
  - id: uart_bus
    tx_pin: D4
    rx_pin:
      number: D3
      mode:
        input: true
        pullup: true
    baud_rate: 1200
    data_bits: 8
    parity: NONE
    stop_bits: 2

micronova:
  uart_id: uart_bus
  enable_rx_pin: D2

# ---------------------------------------------------------------------------
# Readings
# ---------------------------------------------------------------------------
sensor:
  - platform: micronova
    room_temperature:            # RAM 0x01, raw value / 2
      name: "Room temperature"
    fumes_temperature:           # RAM 0x5C on this stove (ESPHome default is 0x3E)
      name: "Fumes temperature"
      memory_location: 0x00
      memory_address: 0x5C
    stove_power:                 # RAM 0x34: actual flame power
      name: "Flame power"

  - platform: micronova
    memory_address_sensor:       # RAM 0x21: status code (see text_sensor below)
      id: status_raw
      name: "Status (raw code)"
      memory_location: 0x00
      memory_address: 0x21
      entity_category: diagnostic

  - platform: micronova
    memory_address_sensor:       # RAM 0x37: measured speed of the fumes extractor
      name: "Fumes extractor speed"
      memory_location: 0x00
      memory_address: 0x37
      entity_category: diagnostic

  - platform: micronova
    memory_address_sensor:       # RAM 0x04: speed applied to ducted fan V2
      name: "Ducted fan V2 actual speed"
      memory_location: 0x00
      memory_address: 0x04
      entity_category: diagnostic

text_sensor:
  - platform: template
    name: "Status"
    update_interval: 30s
    lambda: |-
      if (isnan(id(status_raw).state)) return {};
      int c = (int) id(status_raw).state;
      switch (c) {
        case 0: return {"Off"};
        case 1: return {"Starting"};
        case 2: return {"Pre-ignition"};
        case 3: return {"Ignition"};
        case 5: return {"Ignition (phase 2)"};
        case 6: return {"Stabilisation"};
        case 7: return {"Running"};
        case 8: return {"Brazier cleaning"};
        case 9: return {"Final cleaning"};
        default: return {std::string("Unknown code (") + to_string(c) + ")"};
      }

# ---------------------------------------------------------------------------
# User settings (EEPROM). Change them by hand: no automation that writes
# every few minutes, EEPROM wears out.
# ---------------------------------------------------------------------------
number:
  - platform: micronova
    thermostat_temperature:      # EEPROM 0x6B, in half-degrees
      name: "Temperature setpoint"
      memory_location: 0x20
      memory_address: 0x6B
      step: 0.5
    power_level:                 # EEPROM 0xD0: 1 to 5 (0 = Silent, see button)
      name: "Requested power level"
      memory_location: 0x20
      memory_address: 0xD0

  - platform: micronova
    thermostat_temperature:      # EEPROM 0xCD: V2 target temperature, in half-degrees
      name: "Ducted fan V2 temperature"
      memory_location: 0x20
      memory_address: 0xCD
      step: 0.5
    power_level:                 # EEPROM 0xCF: V2 speed (0 = OFF, 1 to 5)
      name: "Ducted fan V2 speed"
      memory_location: 0x20
      memory_address: 0xCF

button:
  - platform: micronova
    custom_button:
      name: "Silent mode"
      memory_location: 0x20
      memory_address: 0xD0
      memory_data: 0x00

  - platform: micronova
    custom_button:               # EEPROM 0xCE: V2 mode, 0 = Manual
      name: "Ducted fan V2 manual mode"
      memory_location: 0x20
      memory_address: 0xCE
      memory_data: 0x00

  - platform: micronova
    custom_button:               # EEPROM 0xCE: V2 mode, 2 = Auto
      name: "Ducted fan V2 auto mode"
      memory_location: 0x20
      memory_address: 0xCE
      memory_data: 0x02

  - platform: micronova
    custom_button:
      name: "Ducted fan V2 off"
      memory_location: 0x20
      memory_address: 0xCF
      memory_data: 0x00

# ---------------------------------------------------------------------------
# On / off (tested, see docs/on-off-test.md)
# Writes to RAM 0x21, the same address as the status.
#  - On : 0x01, only sent when the stove is off (status 0).
#  - Off: 0x09, the "Final cleaning" code of THIS stove. ESPHome's default
#    (0x06) is the stabilisation phase here.
#  - restore_mode DISABLED: no command is sent when the ESP reboots.
# ---------------------------------------------------------------------------
switch:
  - platform: micronova
    stove:
      name: "Stove on/off"
      restore_mode: DISABLED
      memory_data_on: 0x01
      memory_data_off: 0x09
