# READ-ONLY scan of the Micronova memory.
# Temporarily replaces the normal configuration (same pins).
# Two buttons in Home Assistant: "Scan RAM" (0x00) and "Scan EEPROM" (0x20).
# Each scan reads the 256 addresses (about one minute) and writes them to the logs:
#   [I][scan]: RAM 0x21 = 7
# Micronova write commands start with 0x80 or 0xA0: this file sends none.
# How to use it: docs/scanning-method.md

esphome:
  name: pellet-stove
  friendly_name: Pellet stove

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pellet-Stove Fallback Hotspot"
    password: !secret ap_password

captive_portal:

uart:
  - id: uart_bus
    tx_pin: D4
    rx_pin:
      number: D3
      mode:
        input: true
        pullup: true
    baud_rate: 1200
    data_bits: 8
    parity: NONE
    stop_bits: 2

# Receive-enable of the philibertc board (D2): high = send, low = listen
output:
  - platform: gpio
    id: enable_rx
    pin: D2

globals:
  - id: scan_loc
    type: int
    initial_value: '0'
  - id: scan_addr
    type: int
    initial_value: '0'

script:
  - id: scan
    mode: single
    then:
      - lambda: |-
          id(scan_addr) = 0;
          ESP_LOGI("scan", "=== START %s ===", id(scan_loc) == 0 ? "RAM" : "EEPROM");
      - repeat:
          count: 256
          then:
            - lambda: |-
                uint8_t junk;
                while (id(uart_bus).available()) id(uart_bus).read_byte(&junk);
                id(enable_rx).turn_on();
                uint8_t cmd[2] = {(uint8_t) id(scan_loc), (uint8_t) id(scan_addr)};
                id(uart_bus).write_array(cmd, 2);
                id(uart_bus).flush();
                id(enable_rx).turn_off();
            - delay: 200ms
            - lambda: |-
                const char *zone = id(scan_loc) == 0 ? "RAM" : "EEPROM";
                if (id(uart_bus).available() >= 2) {
                  uint8_t r[2];
                  id(uart_bus).read_array(r, 2);
                  ESP_LOGI("scan", "%s 0x%02X = %d", zone, id(scan_addr), r[1]);
                } else {
                  ESP_LOGW("scan", "%s 0x%02X: no answer", zone, id(scan_addr));
                }
                id(scan_addr) += 1;
      - lambda: 'ESP_LOGI("scan", "=== END ===");'

button:
  - platform: template
    name: "Scan EEPROM"
    on_press:
      - lambda: 'id(scan_loc) = 0x20;'
      - script.execute: scan
  - platform: template
    name: "Scan RAM"
    on_press:
      - lambda: 'id(scan_loc) = 0x00;'
      - script.execute: scan
